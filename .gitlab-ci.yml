image: "374673712317.dkr.ecr.us-gov-west-1.amazonaws.com/cicd:latest" # Set default image

default:
  tags: # Set default runner tag for jobs
    - govcloud-production

# Pipeline Structure:
# - test: Run tests for feature branches
# - build: Docker and Terraform jobs run in parallel (independent of each other)
# - deploy: Deployment jobs that depend on their respective build jobs
#
# Docker path: get_ecr_credentials → build → Refresh Service
# Terraform path: plan → apply
# Both paths are independent and can run simultaneously
stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_REF_NAME == 'master'
      variables:
        ENV: prod # This determines which TF state file the changes get written to, and is also used to tag the image
        APP_NAME: "ghost-dashboard"
        DOMAIN_NAME: "ghost-aws.gd-ms.com"
    - if: $CI_COMMIT_REF_NAME == 'dev'
      variables:
        ENV: dev
        APP_NAME: "ghost-dashboard-dev"
        DOMAIN_NAME: "ghost-aws-dev.gd-ms.com"
    - if: $CI_COMMIT_REF_NAME != "dev" && $CI_COMMIT_REF_NAME != "master"
      variables:
        ENV: test
        APP_NAME: "ghost-dashboard-test"

variables:
  AWS_ACCOUNT_ID: "461760157232" # Make sure this matches the account id Terraform variable
  AWS_REGION: "us-gov-west-1"
#   ECR_REPO: "ghost-dashboard" # ECR repository name. Ensure this matches what is in the ECR Terraform setup
  TF_WORKING_DIR: "terraform" # Directory where the Terraform lives

.assume_role:
  before_script:
    - CREDS=$(aws sts assume-role --role-arn "arn:aws-us-gov:iam::$AWS_ACCOUNT_ID:role/GDMSOrganizationsRole" --role-session-name "aws_action_center_prod")
    - export AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r '.Credentials.AccessKeyId')
    - export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r '.Credentials.SecretAccessKey')
    - export AWS_SESSION_TOKEN=$(echo $CREDS | jq -r '.Credentials.SessionToken')

# Test jobs for feature branches - these run automatically for any branch except master/dev
test_docker_build:
  stage: test
  tags:
    - prod-docker-shared
  image: 504885980539.dkr.ecr.us-gov-east-1.amazonaws.com/docker:latest-dind
  rules:
    - if: $CI_COMMIT_REF_NAME != "dev" && $CI_COMMIT_REF_NAME != "master"
  script:
    - echo "Testing Docker build for feature branch $CI_COMMIT_REF_NAME"
    - docker build -t $APP_NAME:$CI_COMMIT_SHA . # Build image with commit SHA tag
    - echo "Docker build successful - image can be built"
    - docker images | grep $APP_NAME # Show the built image
  allow_failure: false

code_quality_check:
  stage: test
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_REF_NAME != "dev" && $CI_COMMIT_REF_NAME != "master"
  before_script:
    - echo "Installing dependencies for code quality checks..."
    - npm install --legacy-peer-deps --no-audit
  script:
    - echo "Running code quality checks for feature branch $CI_COMMIT_REF_NAME"
    
    # Build test to ensure the project compiles (matches Dockerfile behavior)
    - echo "Testing application build..."
    - NODE_OPTIONS=--max-old-space-size=8192 npm run build
    
    # TypeScript strict checking (non-blocking until existing errors are resolved)
    - echo "Checking TypeScript types..."
    - npx nuxi typecheck || echo "TypeScript typecheck completed with errors (non-blocking)"
    
    - echo "Code quality checks completed successfully"
  cache:
    key: 
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .nuxt/
  artifacts:
    expire_in: 1 hour
    paths:
      - .output/
    when: on_success
  allow_failure: false

# Note that retrieving the ECR credentials has to be a separate stage from building and pushing the docker image.
# This is because we have to use a govcloud-production runner to assume a role in our target account and get the ECR credentials (since it has master account permissions)
#   but we need a prod-docker-shared runner to run the docker commands.
# To resolve this we get the credentials in this job, save them as an artifact, and use that credentials artifact in the build job.
get_ecr_credentials:
  stage: build
  extends: .assume_role
  needs: [] # No dependencies - can run immediately after test stage
  rules:
    - if: $CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "master"
  script:
    - touch ecr-credentials # Create an empty file
    - echo "ECR_PASS=$(aws ecr get-login-password --region $AWS_REGION)" > ecr-credentials # save credentials to file
  artifacts:
    expire_in: 5 min
    paths:
      - ecr-credentials # Exporting as artifact so the build job can consume it

build:
  stage: build
  tags:
    - prod-docker-shared
  image: 504885980539.dkr.ecr.us-gov-east-1.amazonaws.com/docker:latest-dind
  needs:
    - job: get_ecr_credentials
      artifacts: true
  rules:
    - if: $CI_COMMIT_REF_NAME == "dev"
    - if: $CI_COMMIT_REF_NAME == "master"
      when: manual
  script:
    # Authenticate Docker to ECR
    - source ecr-credentials
    - echo $ECR_PASS | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

    # Build and push docker image to ECR
    # - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$ENV . # Tag image with ENV
    # - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$ENV
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$APP_NAME:$ENV . # Tag image with ENV
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$APP_NAME:$ENV
  allow_failure: true

plan:
  stage: build
  needs: [] # No dependencies - can run in parallel with Docker jobs
  rules:
    - if: $CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "master"
      when: manual
  script:
    - cd $TF_WORKING_DIR
    - terraform init "-backend-config=./conf/$ENV.conf"
    - terraform validate
    - terraform plan -out=tfplan -var "env=$ENV" -var "app_name=$APP_NAME" -var "app_domain=$DOMAIN_NAME"
  artifacts:
    paths:
      - $TF_WORKING_DIR/tfplan # Terraform plan file

apply:
  stage: deploy
  needs:
    - job: plan
      artifacts: true
  rules:
    - if: $CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "master"
      when: manual
  script:
    - cd $TF_WORKING_DIR
    - terraform init "-backend-config=./conf/$ENV.conf"
    - terraform apply tfplan

Refresh Service:
  stage: deploy
  extends: .assume_role
  needs:
    - job: build
      artifacts: false
  rules:
    - if: $CI_COMMIT_REF_NAME == "dev"
    - if: $CI_COMMIT_REF_NAME == "master"
      when: manual
  script:
    - aws sts get-caller-identity
    # - aws ecs update-service --cluster $ECR_REPO --service $ECR_REPO-service --force-new-deployment
    - aws ecs update-service --cluster $APP_NAME --service $APP_NAME-service --force-new-deployment

# One-shot operational job: regenerate ghost-dynamodb-config-prod secret with all 24 table keys.
# Run manually on ops/regenerate-dynamodb-secret branch only.
# After the secret is updated and the ECS task restarts, delete this branch.
update_dynamodb_secret:
  stage: deploy
  extends: .assume_role
  needs: []
  variables:
    AWS_ACCOUNT_ID: "461760157232"
    AWS_REGION: "us-gov-west-1"
    SECRET_NAME: "ghost-dynamodb-config-prod"
  rules:
    - if: $CI_COMMIT_REF_NAME == "ops/regenerate-dynamodb-secret"
      when: manual
  script:
    - aws sts get-caller-identity
    - |
      CURRENT_SECRET=$(aws secretsmanager get-secret-value \
        --secret-id "$SECRET_NAME" \
        --region "$AWS_REGION" \
        --query 'SecretString' \
        --output text 2>&1)
      echo "Current secret fetch status: $?"
      echo "Current keys in secret: $(echo "$CURRENT_SECRET" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(list(d.keys()))' 2>/dev/null || echo 'parse failed')"
    - |
      # Build complete 24-key secret JSON, merging over whatever is currently in the secret
      python3 << 'PYEOF'
      import json, subprocess, os

      govcloud_region = "us-gov-west-1"
      commercial_region = "us-east-1"
      deployment_account_id = "461760157232"
      org_account_id = "374673712317"
      commercial_account_id = "205950196477"

      # Canonical full secret - all 24 keys with correct prod table names
      full_secret = {
          "scheduledReports":    {"tableName": "ghost-scheduled-reports-prod",        "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "emailTemplates":      {"tableName": "ghost-email-templates-prod",          "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "reportExecutions":    {"tableName": "ghost-report-executions-prod",        "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "reportExecutionLocks":{"tableName": "ghost-report-execution-locks-prod",   "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "sharedReports":       {"tableName": "ghost-shared-reports-prod",           "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "apiKeys":             {"tableName": "ghost-api-keys-prod",                 "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "apiKeysUsage":        {"tableName": "ghost-api-keys-usage-prod",           "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "shortlinks":          {"tableName": "ghost-dashboard-shortlinks-prod",     "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "externalAccounts":    {"tableName": "gdms_aws_accounts-master",            "environment": "govcloud",    "region": govcloud_region,   "accountId": org_account_id,         "readOnly": True},
          "userPreferences":     {"tableName": "ghost-user-preferences-prod",         "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "accountNotes":        {"tableName": "ghost-account-notes-prod",            "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "chatThreads":         {"tableName": "ghost-chat-threads-prod",             "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "siteConfig":          {"tableName": "ghost-site-config-prod",              "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "adminNotifications":  {"tableName": "ghost-admin-notifications-prod",      "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "streamingMetrics":    {"tableName": "ghost-streaming-metrics",             "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "asyncChatJobs":       {"tableName": "ghost-async-chat-jobs-prod",          "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "asyncMetrics":        {"tableName": "ghost-async-metrics-prod",            "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "budgetAlerts":        {"tableName": "budget-alert-system-alert-history-prod","environment": "commercial","region": commercial_region, "accountId": commercial_account_id,  "readOnly": True},
          "budgetAlertConfig":   {"tableName": "budget-alert-system-config-prod",     "environment": "commercial",  "region": commercial_region, "accountId": commercial_account_id},
          "costTagConfig":       {"tableName": "ghost-cost-tag-config-prod",          "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "userNotifications":   {"tableName": "ghost-user-notifications-prod",       "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "notificationBroadcasts":{"tableName":"ghost-notification-broadcasts-prod", "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "achievementProgress": {"tableName": "ghost-achievement-progress-prod",     "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
          "utilizationAnalysis": {"tableName": "ghost-utilization-analysis-prod",     "environment": "govcloud",    "region": govcloud_region,   "accountId": deployment_account_id},
      }

      # Attempt to read the current secret value and merge (preserve any custom overrides)
      try:
          result = subprocess.run(
              ["aws", "secretsmanager", "get-secret-value",
               "--secret-id", os.environ["SECRET_NAME"],
               "--region", os.environ["AWS_REGION"],
               "--query", "SecretString", "--output", "text"],
              capture_output=True, text=True, check=True
          )
          current = json.loads(result.stdout.strip())
          # Merge: full_secret wins for all keys (we are intentionally resetting)
          merged = {**current, **full_secret}
          print(f"Merged over existing secret. Old key count: {len(current)}, new key count: {len(merged)}")
      except Exception as e:
          print(f"Could not read existing secret (will write fresh): {e}")
          merged = full_secret

      secret_json = json.dumps(merged)
      print(f"Writing secret with keys: {list(merged.keys())}")

      write_result = subprocess.run(
          ["aws", "secretsmanager", "put-secret-value",
           "--secret-id", os.environ["SECRET_NAME"],
           "--region", os.environ["AWS_REGION"],
           "--secret-string", secret_json],
          capture_output=True, text=True
      )
      if write_result.returncode != 0:
          print("ERROR writing secret:", write_result.stderr)
          exit(1)
      else:
          print("Secret updated successfully.")
          print(write_result.stdout)
      PYEOF
    - echo "Secret update complete. Forcing ECS task restart to pick up new secret..."
    - aws ecs update-service --cluster ghost-dashboard --service ghost-dashboard-service --force-new-deployment --region $AWS_REGION
    - echo "ECS service restart triggered. Monitor CloudWatch /ecs/ghost-dashboard for absence of missing-keys warning."
