<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge Preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0f1117;
    color: #e2e4e9;
    min-height: 100vh;
    padding: 3rem 2rem;
  }
  header {
    max-width: 960px;
    margin: 0 auto 2.5rem;
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #fff;
  }
  header p {
    margin-top: .4rem;
    font-size: .85rem;
    color: #6b7280;
  }
  .controls {
    max-width: 960px;
    margin: 0 auto 2rem;
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .controls button {
    padding: .4rem .9rem;
    font-size: .78rem;
    font-family: inherit;
    font-weight: 500;
    border: 1px solid #2a2d35;
    border-radius: 6px;
    background: #1a1c23;
    color: #9ca3af;
    cursor: pointer;
    transition: all .15s;
  }
  .controls button:hover { border-color: #3f4350; color: #d1d5db; }
  .controls button.active { background: #fff; color: #0f1117; border-color: #fff; }
  .section-label {
    max-width: 960px;
    margin: 0 auto .75rem;
    font-size: .7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #4b5563;
  }
  .grid {
    max-width: 960px;
    margin: 0 auto 2.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
  }
  .badge-card {
    position: relative;
    background: #1a1c23;
    border: 1px solid #2a2d35;
    border-radius: 12px;
    padding: 1.5rem 1.25rem 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: all .2s;
    cursor: default;
  }
  .badge-card:hover {
    border-color: #3f4350;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .badge-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    margin-bottom: .9rem;
    position: relative;
    transition: all .2s;
  }
  .badge-card:hover .badge-icon { transform: scale(1.08); }
  .badge-name {
    font-size: .85rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: .3rem;
  }
  .badge-desc {
    font-size: .72rem;
    color: #6b7280;
    line-height: 1.45;
    margin-bottom: .6rem;
  }
  .badge-hint {
    font-size: .65rem;
    font-style: italic;
    color: #4b5563;
    line-height: 1.4;
  }
  .badge-tag {
    position: absolute;
    top: .6rem;
    right: .6rem;
    font-size: .55rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: .15rem .4rem;
    border-radius: 4px;
    background: #2a2d35;
    color: #6b7280;
  }

  .badge-card.locked .badge-icon {
    background: #1f2129 !important;
    color: #3a3d47 !important;
    box-shadow: none !important;
  }
  .badge-card.locked .badge-name { color: #4b5563; }
  .badge-card.locked .badge-desc { display: none; }
  .badge-card.locked .badge-hint { color: #3a3d47; }
  .badge-card.locked:hover .badge-icon { transform: scale(1.04); }

  .toggle-row {
    max-width: 960px;
    margin: 0 auto 1.5rem;
    display: flex;
    align-items: center;
    gap: .6rem;
  }
  .toggle {
    width: 36px;
    height: 20px;
    border-radius: 10px;
    background: #2a2d35;
    position: relative;
    cursor: pointer;
    transition: background .2s;
  }
  .toggle.on { background: #3B82F6; }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform .2s;
  }
  .toggle.on::after { transform: translateX(16px); }
  .toggle-label {
    font-size: .78rem;
    color: #6b7280;
  }
  .stats {
    max-width: 960px;
    margin: 0 auto 2rem;
    display: flex;
    gap: 2rem;
  }
  .stat-item {
    display: flex;
    flex-direction: column;
    gap: .15rem;
  }
  .stat-num {
    font-size: 1.6rem;
    font-weight: 600;
    color: #fff;
  }
  .stat-label {
    font-size: .7rem;
    color: #4b5563;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
</style>
</head>
<body>

<header>
  <h1>Badge System Preview</h1>
  <p>35 badges across 3 categories. Toggle locked state to preview the unearned view.</p>
</header>

<div class="stats" id="stats"></div>

<div class="toggle-row">
  <div class="toggle" id="lockToggle" onclick="toggleLock()"></div>
  <span class="toggle-label">Show locked (unearned) state</span>
</div>

<div class="controls" id="controls"></div>

<div id="sections"></div>

<script>
const badges = [
  { id:"cartographer", name:"Cartographer", description:"Visited every top-level section of the platform", hint:"There's more to this place than you think.", category:"discovery", hidden:false, icon:"fa-solid fa-map", color:"#3B82F6" },
  { id:"filter-fiend", name:"Filter Fiend", description:"Used advanced filters on 5 different pages", hint:"Narrow your focus.", category:"discovery", hidden:false, icon:"fa-solid fa-filter", color:"#8B5CF6" },
  { id:"time-traveler", name:"Time Traveler", description:"Used a custom date range spanning more than 1 year", hint:"Look further back than you normally would.", category:"discovery", hidden:false, icon:"fa-solid fa-clock-rotate-left", color:"#06B6D4" },
  { id:"comparator", name:"Comparator", description:"Ran a side-by-side account comparison", hint:"Two things are better understood together.", category:"discovery", hidden:false, icon:"fa-solid fa-code-compare", color:"#F59E0B" },
  { id:"exporter", name:"Exporter", description:"Exported data in 3 different formats", hint:"Take your data places.", category:"discovery", hidden:false, icon:"fa-solid fa-file-export", color:"#10B981" },
  { id:"deep-diver", name:"Deep Diver", description:"Drilled down 4+ levels into a cost breakdown", hint:"The surface never tells the full story.", category:"discovery", hidden:false, icon:"fa-solid fa-water", color:"#0369A1" },
  { id:"bookmarker", name:"Bookmarker", description:"Saved 3 custom dashboard views", hint:"Make it yours.", category:"discovery", hidden:false, icon:"fa-solid fa-bookmark", color:"#E11D48" },
  { id:"search-sage", name:"Search Sage", description:"Used the global search to navigate to 10 different results", hint:"The fastest path is the one you type.", category:"discovery", hidden:false, icon:"fa-solid fa-magnifying-glass", color:"#7C3AED" },
  { id:"shortcut-artist", name:"Shortcut Artist", description:"Used 5 different keyboard shortcuts", hint:"Your mouse is optional.", category:"discovery", hidden:false, icon:"fa-solid fa-keyboard", color:"#64748B" },
  { id:"alert-setter", name:"Alert Setter", description:"Configured a budget alert for the first time", hint:"Know before it's too late.", category:"discovery", hidden:false, icon:"fa-solid fa-bell", color:"#F97316" },
  { id:"annotator", name:"Annotator", description:"Added a note to a cost graph data point", hint:"Graphs have more to say when you help them.", category:"discovery", hidden:false, icon:"fa-solid fa-pen-to-square", color:"#14B8A6" },
  { id:"expedition-complete", name:"Trailblazer", description:"Completed a guided expedition end-to-end", hint:"Follow the path. See what you find.", category:"discovery", hidden:false, icon:"fa-solid fa-route", color:"#D97706" },
  { id:"favorite-fan", name:"Favorite Fan", description:"Favorited an AWS account", hint:"Mark what matters.", category:"discovery", hidden:false, icon:"fa-solid fa-star", color:"#FBBF24" },
  { id:"double-agent", name:"Double Agent", description:"Accessed more than 2 AWS accounts", hint:"You belong in more places than one.", category:"discovery", hidden:false, icon:"fa-solid fa-user-group", color:"#38BDF8" },
  { id:"five-alive", name:"Five Alive", description:"Accessed more than 5 AWS accounts", hint:"Your reach is growing.", category:"discovery", hidden:false, icon:"fa-solid fa-users", color:"#2DD4BF" },
  { id:"account-connoisseur", name:"Account Connoisseur", description:"Accessed more than 10 AWS accounts", hint:"At this point you might as well see them all.", category:"discovery", hidden:false, icon:"fa-solid fa-building", color:"#818CF8" },
  { id:"decorator", name:"Decorator", description:"Customized the home page layout or widgets", hint:"Default is just a starting point.", category:"discovery", hidden:false, icon:"fa-solid fa-palette", color:"#F472B6" },
  { id:"ai-whisperer", name:"AI Whisperer", description:"Used the AI chat assistant for the first time", hint:"Try asking it something.", category:"discovery", hidden:false, icon:"fa-solid fa-robot", color:"#A78BFA" },
  { id:"voice-heard", name:"Voice Heard", description:"Submitted feedback through the platform", hint:"We're listening.", category:"discovery", hidden:false, icon:"fa-solid fa-comment-dots", color:"#34D399" },
  { id:"collaborator", name:"Collaborator", description:"Shared a report or dashboard link with a colleague", hint:"Insights are better together.", category:"discovery", hidden:false, icon:"fa-solid fa-share-nodes", color:"#60A5FA" },
  { id:"scheduler", name:"Scheduler", description:"Set up a recurring scheduled report", hint:"Let the platform do the remembering.", category:"discovery", hidden:false, icon:"fa-solid fa-calendar-check", color:"#4ADE80" },
  { id:"theme-switcher", name:"Theme Switcher", description:"Changed the platform theme or appearance", hint:"Make it look the way you think.", category:"discovery", hidden:false, icon:"fa-solid fa-circle-half-stroke", color:"#CBD5E1" },
  { id:"philosopher", name:"Philosopher", description:"Asked the AI chat a non-work-related question", hint:"Not every question has a line item.", category:"hidden", hidden:true, icon:"fa-solid fa-brain", color:"#C084FC" },
  { id:"mobile-scout", name:"Mobile Scout", description:"Accessed the platform from a mobile device", hint:"Some people never leave their desk. You're not one of them.", category:"hidden", hidden:true, icon:"fa-solid fa-mobile-screen", color:"#FB923C" },
  { id:"early-adopter", name:"Early Adopter", description:"Used a new feature within 24 hours of its release", hint:"First in line.", category:"hidden", hidden:true, icon:"fa-solid fa-rocket", color:"#F43F5E" },
  { id:"ctrl-z", name:"Ctrl+Z", description:"Undid an action within 3 seconds of performing it", hint:"Second thoughts count.", category:"hidden", hidden:true, icon:"fa-solid fa-rotate-left", color:"#94A3B8" },
  { id:"the-return", name:"The Return", description:"Logged in after 30+ days of inactivity", hint:"Welcome back. Things have changed.", category:"hidden", hidden:true, icon:"fa-solid fa-door-open", color:"#E879F9" },
  { id:"night-owl", name:"Night Owl", description:"Used the platform between midnight and 5am", hint:"Some things are only visible at night.", category:"hidden", hidden:true, icon:"fa-solid fa-moon", color:"#6366F1" },
  { id:"speed-run", name:"Speed Run", description:"Navigated to 10 different pages within 60 seconds", hint:"Slow down \u2014 or don't.", category:"hidden", hidden:true, icon:"fa-solid fa-bolt", color:"#EAB308" },
  { id:"historian", name:"Historian", description:"Looked at cost data older than 12 months", hint:"The past has lessons if you go looking.", category:"hidden", hidden:true, icon:"fa-solid fa-scroll", color:"#A16207" },
  { id:"polyglot", name:"Polyglot", description:"Exported in CSV, JSON, and PDF in the same session", hint:"Why pick one format when you can have them all?", category:"hidden", hidden:true, icon:"fa-solid fa-language", color:"#059669" },
  { id:"the-scroll", name:"The Scroll", description:"Scrolled to the absolute bottom of the longest table", hint:"Not everyone has the patience to reach the end.", category:"hidden", hidden:true, icon:"fa-solid fa-arrow-down-long", color:"#78716C" },
  { id:"badge-watcher", name:"Badge Watcher", description:"Viewed the badges page for the first time", hint:"You're looking at it.", category:"meta", hidden:false, icon:"fa-solid fa-eye", color:"#EC4899" },
  { id:"completionist", name:"Completionist", description:"Earned every non-hidden badge", hint:"You'll know when you're done.", category:"meta", hidden:false, icon:"fa-solid fa-trophy", color:"#CA8A04" },
  { id:"mystery-five", name:"???", description:"Earned 5 hidden badges", hint:"Keep finding what isn't listed.", category:"meta", hidden:false, icon:"fa-solid fa-gem", color:"#A855F7" }
];

const categoryLabels = { discovery: "Feature Discovery", hidden: "Hidden", meta: "Meta" };
const categories = ["discovery","hidden","meta"];
let activeFilter = "all";
let locked = false;

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function renderStats() {
  const el = document.getElementById("stats");
  const counts = { discovery:0, hidden:0, meta:0 };
  badges.forEach(b => counts[b.category]++);
  el.innerHTML = `
    <div class="stat-item"><span class="stat-num">${badges.length}</span><span class="stat-label">Total</span></div>
    <div class="stat-item"><span class="stat-num">${counts.discovery}</span><span class="stat-label">Discovery</span></div>
    <div class="stat-item"><span class="stat-num">${counts.hidden}</span><span class="stat-label">Hidden</span></div>
    <div class="stat-item"><span class="stat-num">${counts.meta}</span><span class="stat-label">Meta</span></div>
  `;
}

function renderControls() {
  const el = document.getElementById("controls");
  const items = [{ key:"all", label:"All" }, ...categories.map(c => ({ key:c, label:categoryLabels[c] }))];
  el.innerHTML = items.map(i =>
    `<button class="${activeFilter===i.key?'active':''}" onclick="setFilter('${i.key}')">${i.label}</button>`
  ).join("");
}

function renderBadges() {
  const el = document.getElementById("sections");
  const filtered = activeFilter === "all" ? categories : [activeFilter];
  el.innerHTML = filtered.map(cat => {
    const items = badges.filter(b => b.category === cat);
    return `
      <div class="section-label">${categoryLabels[cat]}</div>
      <div class="grid">
        ${items.map(b => {
          const rgb = hexToRgb(b.color);
          const isLocked = locked;
          const showName = isLocked && b.hidden ? "???" : b.name;
          return `
            <div class="badge-card ${isLocked ? 'locked' : ''}">
              ${b.hidden ? '<span class="badge-tag">Hidden</span>' : ''}
              <div class="badge-icon" style="
                background: rgba(${rgb},.12);
                color: ${b.color};
                box-shadow: 0 0 20px rgba(${rgb},.15);
              ">
                <i class="${isLocked && b.hidden ? 'fa-solid fa-question' : b.icon}"></i>
              </div>
              <div class="badge-name">${showName}</div>
              <div class="badge-desc">${b.description}</div>
              <div class="badge-hint">"${isLocked ? b.hint : b.hint}"</div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }).join("");
}

function setFilter(f) {
  activeFilter = f;
  renderControls();
  renderBadges();
}

function toggleLock() {
  locked = !locked;
  document.getElementById("lockToggle").classList.toggle("on", locked);
  renderBadges();
}

renderStats();
renderControls();
renderBadges();
</script>
</body>
</html>
