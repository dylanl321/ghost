badges:
  # ── Feature Discovery ────────────────────────────────────────────────
  - id: cartographer
    name: Cartographer
    description: Visited every top-level section of the platform
    hint: There's more to this place than you think.
    category: discovery
    hidden: false
    icon: fa-solid fa-map
    color: "#3B82F6"
    rule:
      type: unique_count
      event: page.visited
      field: page
      threshold: 8

  - id: filter-fiend
    name: Filter Fiend
    description: Used advanced filters on 5 different pages
    hint: Narrow your focus.
    category: discovery
    hidden: false
    icon: fa-solid fa-filter
    color: "#8B5CF6"
    rule:
      type: unique_count
      event: filter.applied
      field: page
      threshold: 5

  - id: time-traveler
    name: Time Traveler
    description: Used a custom date range spanning more than 1 year
    hint: Look further back than you normally would.
    category: discovery
    hidden: false
    icon: fa-solid fa-clock-rotate-left
    color: "#06B6D4"
    rule:
      type: condition
      key: date_range_exceeds_one_year

  - id: comparator
    name: Comparator
    description: Ran a side-by-side account comparison
    hint: Two things are better understood together.
    category: discovery
    hidden: false
    icon: fa-solid fa-code-compare
    color: "#F59E0B"
    rule:
      type: event_once
      event: comparison.started

  - id: exporter
    name: Exporter
    description: Exported data in 3 different formats
    hint: Take your data places.
    category: discovery
    hidden: false
    icon: fa-solid fa-file-export
    color: "#10B981"
    rule:
      type: unique_count
      event: export.completed
      field: format
      threshold: 3

  - id: deep-diver
    name: Deep Diver
    description: Drilled down 4+ levels into a cost breakdown
    hint: The surface never tells the full story.
    category: discovery
    hidden: false
    icon: fa-solid fa-water
    color: "#0369A1"
    rule:
      type: condition
      key: drilldown_depth_4_plus

  - id: bookmarker
    name: Bookmarker
    description: Saved 3 custom dashboard views
    hint: Make it yours.
    category: discovery
    hidden: false
    icon: fa-solid fa-bookmark
    color: "#E11D48"
    rule:
      type: event_count
      event: dashboard.saved
      threshold: 3

  - id: search-sage
    name: Search Sage
    description: Used the global search to navigate to 10 different results
    hint: The fastest path is the one you type.
    category: discovery
    hidden: false
    icon: fa-solid fa-magnifying-glass
    color: "#7C3AED"
    rule:
      type: event_count
      event: search.navigated
      threshold: 10

  - id: shortcut-artist
    name: Shortcut Artist
    description: Used 5 different keyboard shortcuts
    hint: Your mouse is optional.
    category: discovery
    hidden: false
    icon: fa-solid fa-keyboard
    color: "#64748B"
    rule:
      type: unique_count
      event: shortcut.used
      field: shortcut
      threshold: 5

  - id: alert-setter
    name: Alert Setter
    description: Configured a budget alert for the first time
    hint: Know before it's too late.
    category: discovery
    hidden: false
    icon: fa-solid fa-bell
    color: "#F97316"
    rule:
      type: event_once
      event: alert.created

  - id: annotator
    name: Annotator
    description: Added a note to a cost graph data point
    hint: Graphs have more to say when you help them.
    category: discovery
    hidden: false
    icon: fa-solid fa-pen-to-square
    color: "#14B8A6"
    rule:
      type: event_once
      event: graph.annotated

  - id: expedition-complete
    name: Trailblazer
    description: Completed a guided expedition end-to-end
    hint: Follow the path. See what you find.
    category: discovery
    hidden: false
    icon: fa-solid fa-route
    color: "#D97706"
    rule:
      type: event_once
      event: expedition.completed

  - id: favorite-fan
    name: Favorite Fan
    description: Favorited an AWS account
    hint: Mark what matters.
    category: discovery
    hidden: false
    icon: fa-solid fa-star
    color: "#FBBF24"
    rule:
      type: event_once
      event: account.favorited

  - id: double-agent
    name: Double Agent
    description: Accessed more than 2 AWS accounts
    hint: You belong in more places than one.
    category: discovery
    hidden: false
    icon: fa-solid fa-user-group
    color: "#38BDF8"
    rule:
      type: unique_count
      event: account.viewed
      field: accountId
      threshold: 2

  - id: five-alive
    name: Five Alive
    description: Accessed more than 5 AWS accounts
    hint: Your reach is growing.
    category: discovery
    hidden: false
    icon: fa-solid fa-users
    color: "#2DD4BF"
    rule:
      type: unique_count
      event: account.viewed
      field: accountId
      threshold: 5

  - id: account-connoisseur
    name: Account Connoisseur
    description: Accessed more than 10 AWS accounts
    hint: At this point you might as well see them all.
    category: discovery
    hidden: false
    icon: fa-solid fa-building
    color: "#818CF8"
    rule:
      type: unique_count
      event: account.viewed
      field: accountId
      threshold: 10

  - id: decorator
    name: Decorator
    description: Customized the home page layout or widgets
    hint: Default is just a starting point.
    category: discovery
    hidden: false
    icon: fa-solid fa-palette
    color: "#F472B6"
    rule:
      type: event_once
      event: dashboard.customized

  - id: ai-whisperer
    name: AI Whisperer
    description: Used the AI chat assistant for the first time
    hint: Try asking it something.
    category: discovery
    hidden: false
    icon: fa-solid fa-robot
    color: "#A78BFA"
    rule:
      type: event_once
      event: ai.chat.sent

  - id: voice-heard
    name: Voice Heard
    description: Submitted feedback through the platform
    hint: We're listening.
    category: discovery
    hidden: false
    icon: fa-solid fa-comment-dots
    color: "#34D399"
    rule:
      type: event_once
      event: feedback.submitted

  - id: collaborator
    name: Collaborator
    description: Shared a report or dashboard link with a colleague
    hint: Insights are better together.
    category: discovery
    hidden: false
    icon: fa-solid fa-share-nodes
    color: "#60A5FA"
    rule:
      type: event_once
      event: report.shared

  - id: scheduler
    name: Scheduler
    description: Set up a recurring scheduled report
    hint: Let the platform do the remembering.
    category: discovery
    hidden: false
    icon: fa-solid fa-calendar-check
    color: "#4ADE80"
    rule:
      type: event_once
      event: report.scheduled

  - id: theme-switcher
    name: Theme Switcher
    description: Changed the platform theme or appearance
    hint: Make it look the way you think.
    category: discovery
    hidden: false
    icon: fa-solid fa-circle-half-stroke
    color: "#CBD5E1"
    rule:
      type: event_once
      event: theme.changed

  # ── Hidden ───────────────────────────────────────────────────────────
  - id: philosopher
    name: Philosopher
    description: Asked the AI chat a non-work-related question
    hint: Not every question has a line item.
    category: hidden
    hidden: true
    icon: fa-solid fa-brain
    color: "#C084FC"
    rule:
      type: condition
      key: ai_non_work_question

  - id: mobile-scout
    name: Mobile Scout
    description: Accessed the platform from a mobile device
    hint: Some people never leave their desk. You're not one of them.
    category: hidden
    hidden: true
    icon: fa-solid fa-mobile-screen
    color: "#FB923C"
    rule:
      type: condition
      key: mobile_user_agent

  - id: early-adopter
    name: Early Adopter
    description: Used a new feature within 24 hours of its release
    hint: First in line.
    category: hidden
    hidden: true
    icon: fa-solid fa-rocket
    color: "#F43F5E"
    rule:
      type: condition
      key: feature_used_within_24h

  - id: ctrl-z
    name: Ctrl+Z
    description: Undid an action within 3 seconds of performing it
    hint: Second thoughts count.
    category: hidden
    hidden: true
    icon: fa-solid fa-rotate-left
    color: "#94A3B8"
    rule:
      type: condition
      key: undo_within_3_seconds

  - id: the-return
    name: The Return
    description: Logged in after 30+ days of inactivity
    hint: Welcome back. Things have changed.
    category: hidden
    hidden: true
    icon: fa-solid fa-door-open
    color: "#E879F9"
    rule:
      type: condition
      key: inactive_30_days_then_login

  - id: night-owl
    name: Night Owl
    description: Used the platform between midnight and 5am
    hint: Some things are only visible at night.
    category: hidden
    hidden: true
    icon: fa-solid fa-moon
    color: "#6366F1"
    rule:
      type: condition
      key: used_between_midnight_and_5am

  - id: speed-run
    name: Speed Run
    description: Navigated to 10 different pages within 60 seconds
    hint: Slow down — or don't.
    category: hidden
    hidden: true
    icon: fa-solid fa-bolt
    color: "#EAB308"
    rule:
      type: condition
      key: visited_10_pages_in_60_seconds

  - id: historian
    name: Historian
    description: Looked at cost data older than 12 months
    hint: The past has lessons if you go looking.
    category: hidden
    hidden: true
    icon: fa-solid fa-scroll
    color: "#A16207"
    rule:
      type: condition
      key: viewed_data_older_than_12_months

  - id: polyglot
    name: Polyglot
    description: Exported in CSV, JSON, and PDF in the same session
    hint: Why pick one format when you can have them all?
    category: hidden
    hidden: true
    icon: fa-solid fa-language
    color: "#059669"
    rule:
      type: condition
      key: exported_all_formats_in_session

  - id: the-scroll
    name: The Scroll
    description: Scrolled to the absolute bottom of the longest table
    hint: Not everyone has the patience to reach the end.
    category: hidden
    hidden: true
    icon: fa-solid fa-arrow-down-long
    color: "#78716C"
    rule:
      type: condition
      key: scrolled_table_to_bottom

  # ── Meta ─────────────────────────────────────────────────────────────
  - id: badge-watcher
    name: Badge Watcher
    description: Viewed the badges page for the first time
    hint: You're looking at it.
    category: meta
    hidden: false
    icon: fa-solid fa-eye
    color: "#EC4899"
    rule:
      type: event_once
      event: badges.viewed

  - id: completionist
    name: Completionist
    description: Earned every non-hidden badge
    hint: You'll know when you're done.
    category: meta
    hidden: false
    icon: fa-solid fa-trophy
    color: "#CA8A04"
    rule:
      type: condition
      key: all_non_hidden_badges_earned

  - id: mystery-five
    name: "???"
    description: Earned 5 hidden badges
    hint: Keep finding what isn't listed.
    category: meta
    hidden: false
    icon: fa-solid fa-gem
    color: "#A855F7"
    rule:
      type: condition
      key: five_hidden_badges_earned
